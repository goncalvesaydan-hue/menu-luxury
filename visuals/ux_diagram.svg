<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F9FAFB"/>

  <!-- Definitions for Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
    </marker>
  </defs>

  <!-- Start Point -->
  <rect x="40" y="250" width="120" height="60" rx="30" fill="#3B82F6"/>
  <text x="100" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">QR CODE SCAN</text>

  <!-- Primary View: Main Menu -->
  <rect x="240" y="220" width="200" height="120" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3"/>
  <text x="340" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827" font-weight="bold">MENU PRINCIPAL</text>
  <text x="340" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">(The Hub)</text>
  <text x="340" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Categorias &amp; Pratos</text>

  <!-- Detail View -->
  <rect x="540" y="220" width="200" height="120" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
  <text x="640" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827" font-weight="bold">DETALHE DO PRATO</text>
  <text x="640" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">(The Desire)</text>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Fotos HD &amp; Ingredientes</text>

  <!-- Branding View -->
  <rect x="240" y="420" width="200" height="120" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
  <text x="340" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827" font-weight="bold">HISTÓRIA / BRANDING</text>
  <text x="340" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">(The Story)</text>
  <text x="340" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Filosofia &amp; Chef</text>

  <!-- Utility View -->
  <rect x="540" y="420" width="200" height="120" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="3"/>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827" font-weight="bold">CONTACTOS / INFO</text>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">(The Utility)</text>
  <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Mapas &amp; Horários</text>

  <!-- Arrows and Labels -->
  <!-- QR to Main Menu -->
  <line x1="160" y1="280" x2="230" y2="280" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="195" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Abre Instantâneo</text>

  <!-- Main Menu to Detail -->
  <line x1="440" y1="260" x2="530" y2="260" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="485" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#10B981">Clique no Prato</text>

  <!-- Detail back to Main -->
  <line x1="540" y1="280" x2="450" y2="280" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="485" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Voltar</text>

  <!-- Main Menu to Story -->
  <line x1="340" y1="340" x2="340" y2="410" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="350" y="375" text-anchor="start" font-family="Arial, sans-serif" font-size="10" fill="#F59E0B">Info Marca</text>

  <!-- Main Menu to Utility -->
  <line x1="440" y1="340" x2="530" y2="440" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="485" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Contactos</text>

  <!-- Legend -->
  <rect x="40" y="450" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1"/>
  <text x="50" y="470" font-family="Arial, sans-serif" font-size="12" fill="#111827" font-weight="bold">Legenda:</text>
  <line x1="55" y1="485" x2="75" y2="485" stroke="#3B82F6" stroke-width="3"/>
  <text x="80" y="490" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Fluxo Principal</text>
  <line x1="55" y1="505" x2="75" y2="505" stroke="#10B981" stroke-width="3"/>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Conversão (Premium)</text>
  <line x1="55" y1="525" x2="75" y2="525" stroke="#F59E0B" stroke-width="3"/>
  <text x="80" y="530" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Branding</text>
</svg>
